<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Exam | PorikkhaHub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f1f5f9;
    padding:30px 20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.header{
    background:#1e3a8a;
    color:white;
    padding:22px 25px;
    border-radius:18px;
    margin-bottom:25px;
}

.header h1{
    font-size:25px;
    margin-bottom:5px;
}

.header p{
    opacity:.85;
}

.card{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

label{
    display:block;
    margin:18px 0 7px;
    font-weight:600;
    color:#334155;
}

input,
textarea,
select{
    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#2563eb;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.draft{
    background:#64748b;
    color:white;
}

.publish{
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

#message{
    margin-top:18px;
    text-align:center;
    min-height:22px;
    font-size:14px;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#2563eb;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>Create New Exam</h1>
        <p>PorikkhaHub Admin Panel</p>
    </div>

    <div class="card">

        <form id="examForm">

            <label>Exam Name</label>

            <input
                type="text"
                id="examTitle"
                placeholder="Example: Class 9 Physics Model Test"
                required
            >

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Write a short description about this exam..."
            ></textarea>

            <label>Exam Type</label>

            <select id="examType">
                <option value="MCQ">MCQ</option>
                <option value="CQ">CQ</option>
                <option value="BOTH">MCQ + CQ</option>
            </select>

            <label>Duration (Minutes)</label>

            <input
                type="number"
                id="duration"
                value="30"
                min="1"
                required
            >

            <label>Total Marks</label>

            <input
                type="number"
                id="totalMarks"
                value="20"
                min="0"
                required
            >

            <div class="buttons">

                <button
                    type="button"
                    class="draft"
                    id="draftButton"
                    onclick="createExam(false)"
                >
                    Save as Draft
                </button>

                <button
                    type="button"
                    class="publish"
                    id="publishButton"
                    onclick="createExam(true)"
                >
                    Create & Publish
                </button>

            </div>

            <div id="message"></div>

        </form>

        <a class="back" href="admin-dashboard.html">
            ← Back to Admin Dashboard
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jsjkxpsnuizngofyjvdl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_rGBAYVe2ZeqDk8tvrYy2Tg_m4fbtSLf";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


async function createExam(publish){

    const message =
        document.getElementById("message");

    const draftButton =
        document.getElementById("draftButton");

    const publishButton =
        document.getElementById("publishButton");


    const accessToken =
        localStorage.getItem(
            "porikkhahub_admin_access_token"
        );

    const refreshToken =
        localStorage.getItem(
            "porikkhahub_admin_refresh_token"
        );


    if(!accessToken || !refreshToken){

        message.style.color = "#dc2626";

        message.textContent =
            "Admin session expired. Please login again.";

        return;
    }


    /*
        Restore Supabase session
    */

    message.style.color = "#2563eb";

    message.textContent =
        "Checking admin session...";


    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.setSession({

            access_token: accessToken,

            refresh_token: refreshToken

        });


    if(sessionError){

        console.error(sessionError);

        message.style.color = "#dc2626";

        message.textContent =
            "Admin session expired. Please login again.";

        return;
    }


    /*
        Verify current user
    */

    const {
        data: {
            user
        },
        error: userError

    } =
        await supabaseClient.auth.getUser();


    if(userError || !user){

        message.style.color = "#dc2626";

        message.textContent =
            "Admin session expired. Please login again.";

        return;
    }


    /*
        Get form values
    */

    const title =
        document
        .getElementById("examTitle")
        .value
        .trim();


    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const examType =
        document
        .getElementById("examType")
        .value;


    const duration =
        parseInt(
            document
            .getElementById("duration")
            .value
        );


    const totalMarks =
        parseInt(
            document
            .getElementById("totalMarks")
            .value
        );


    if(!title){

        message.style.color = "#dc2626";

        message.textContent =
            "Please enter exam name.";

        return;
    }


    draftButton.disabled = true;
    publishButton.disabled = true;


    message.style.color = "#2563eb";

    message.textContent =
        publish
        ? "Creating and publishing exam..."
        : "Saving exam as draft...";


    /*
        Call secure RPC function
    */

    const {
        data: exam,
        error: examError
    } =
        await supabaseClient.rpc(
            "create_exam",
            {
                p_title: title,

                p_description: description,

                p_exam_type: examType,

                p_duration_minutes: duration,

                p_total_marks: totalMarks,

                p_is_published: publish
            }
        );


    if(examError){

        console.error(examError);

        message.style.color = "#dc2626";

        message.textContent =
            examError.message;

        draftButton.disabled = false;
        publishButton.disabled = false;

        return;
    }


    /*
        Success
    */

    console.log("Created exam:", exam);

    message.style.color = "#16a34a";

    message.textContent =
        publish
        ? "Exam created and published successfully!"
        : "Exam saved as draft successfully!";


    document
        .getElementById("examForm")
        .reset();


    document
        .getElementById("duration")
        .value = 30;


    document
        .getElementById("totalMarks")
        .value = 20;


    draftButton.disabled = false;
    publishButton.disabled = false;

}

</script>

</body>
</html>
