</div>

<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const supabaseClient = window.supabaseClient;


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    // ==========================================
    // ADMIN CHECK
    // ==========================================

    async function checkAdmin() {

        console.log("Checking admin...");

        if (!supabaseClient) {

            console.error("Supabase client not found.");

            return false;
        }


        const {
            data: authData,
            error: authError
        } = await supabaseClient.auth.getUser();


        console.log("Auth user:", authData?.user);
        console.log("Auth error:", authError);


        if (authError || !authData?.user) {

            console.log("No logged-in user.");

            window.location.href = "admin-login.html";

            return false;
        }


        const {
            data: admin,
            error: adminError
        } = await supabaseClient
            .from("admins")
            .select("id, full_name, email")
            .eq("auth_user_id", authData.user.id)
            .maybeSingle();


        console.log("Admin profile:", admin);
        console.log("Admin profile error:", adminError);


        if (adminError || !admin) {

            console.error("Admin verification failed.");

            alert("Unauthorized: admin account required.");

            await supabaseClient.auth.signOut();

            window.location.href = "admin-login.html";

            return false;
        }


        console.log("Admin verified successfully.");

        return true;
    }


    // ==========================================
    // LOAD DASHBOARD STATISTICS
    // ==========================================

    async function loadDashboard() {

        console.log("Loading dashboard...");


        const allowed = await checkAdmin();

        if (!allowed) {

            return;
        }


        const {
            data,
            error
        } = await supabaseClient.rpc(
            "get_admin_dashboard_stats"
        );


        console.log("Dashboard data:", data);
        console.log("Dashboard error:", error);


        if (error) {

            console.error("Dashboard RPC error:", error);

            document.getElementById("resultsArea").innerHTML =
                '<div class="error">Dashboard loading failed: ' +
                escapeHtml(error.message) +
                '</div>';

            return;
        }


        if (!data) {

            console.error("Dashboard returned no data.");

            return;
        }


        // UPDATE STATISTICS

        document.getElementById("totalExams").textContent =
            data.total_exams ?? 0;

        document.getElementById("publishedExams").textContent =
            data.published_exams ?? 0;

        document.getElementById("totalStudents").textContent =
            data.total_students ?? 0;

        document.getElementById("totalQuestions").textContent =
            data.total_questions ?? 0;

        document.getElementById("submittedExams").textContent =
            data.submitted_exams ?? 0;


        console.log("Statistics updated successfully.");


        // LOAD RESULTS

        await loadRecentResults();

    }


    // ==========================================
    // LOAD RECENT RESULTS
    // ==========================================

    async function loadRecentResults() {

        console.log("Loading recent results...");


        const area =
            document.getElementById("resultsArea");


        const {
            data,
            error
        } = await supabaseClient
            .from("admin_exam_results")
            .select("*")
            .order("submitted_at", {
                ascending: false
            })
            .limit(5);


        console.log("Recent results data:", data);
        console.log("Recent results error:", error);


        if (error) {

            area.innerHTML =
                '<div class="error">' +
                'Could not load recent results: ' +
                escapeHtml(error.message) +
                '</div>';

            return;
        }


        if (!data || data.length === 0) {

            area.innerHTML =
                '<div class="empty">' +
                'No submitted results yet.' +
                '</div>';

            return;
        }


        let html = `
            <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Student</th>
                        <th>Exam</th>
                        <th>Marks</th>
                        <th>Status</th>
                        <th>Submitted</th>
                    </tr>

                </thead>

                <tbody>
        `;


        data.forEach(function (row) {

            let statusClass = "status-submitted";

            if (row.status === "auto_submitted") {
                statusClass = "status-auto";
            }


            let submittedTime = "-";

            if (row.submitted_at) {

                submittedTime =
                    new Date(row.submitted_at)
                        .toLocaleString();

            }


            html += `
                <tr>

                    <td>
                        ${escapeHtml(
                            row.student_name || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            row.exam_title || "-"
                        )}
                    </td>

                    <td>
                        <strong>
                            ${row.obtained_marks ?? 0}
                        </strong>
                        /
                        ${row.total_marks ?? 0}
                    </td>

                    <td>
                        <span class="status ${statusClass}">
                            ${escapeHtml(
                                row.status || "-"
                            )}
                        </span>
                    </td>

                    <td>
                        ${escapeHtml(submittedTime)}
                    </td>

                </tr>
            `;

        });


        html += `
                </tbody>

            </table>

            </div>
        `;


        area.innerHTML = html;


        console.log("Recent results loaded successfully.");

    }


    // ==========================================
    // BUTTON EVENTS
    // ==========================================

    document.getElementById("createExamBtn").onclick =
        function () {
            window.location.href = "create-exam.html";
        };


    document.getElementById("manageExamsBtn").onclick =
        function () {
            window.location.href = "manage-exams.html";
        };


    document.getElementById("resultsBtn").onclick =
        function () {
            window.location.href = "admin-results.html";
        };


    document.getElementById("studentsBtn").onclick =
        function () {
            window.location.href = "admin-students.html";
        };


    document.getElementById("questionsBtn").onclick =
        function () {
            window.location.href = "manage-questions.html";
        };


    // CQ ANSWER SHEETS

    document.getElementById("cqBtn").onclick =
        function () {
            window.location.href = "cq-answer-sheets.html";
        };


    // REFRESH

    document.getElementById("refreshBtn").onclick =
        function () {

            loadDashboard();

        };


    // LOGOUT

    document.getElementById("logoutBtn").onclick =
        async function () {

            console.log("Logging out...");


            if (supabaseClient) {

                await supabaseClient.auth.signOut();

            }


            localStorage.removeItem(
                "porikkhahub_admin"
            );

            localStorage.removeItem(
                "porikkhahub_admin_access_token"
            );

            localStorage.removeItem(
                "porikkhahub_admin_refresh_token"
            );


            window.location.href =
                "admin-login.html";

        };


    // ==========================================
    // START DASHBOARD
    // ==========================================

    window.addEventListener("load", function () {

        console.log(
            "PorikkhaHub Admin Dashboard loaded."
        );

        loadDashboard();

    });

</script>

</body>
</html>
