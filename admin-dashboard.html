<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PorikkhaHub - Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 15px;
            color: #6b7280;
        }

        .stat-card p {
            margin: 10px 0 0;
            font-size: 30px;
            font-weight: bold;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-btn {
            border: none;
            padding: 17px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: left;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn span {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            font-weight: normal;
            color: #6b7280;
        }

        .section {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .empty {
            color: #6b7280;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PorikkhaHub Admin</h1>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="welcome">
        <h2>Admin Dashboard</h2>
        <p>Manage exams, students, MCQ and CQ submissions from here.</p>
    </div>

    <!-- Statistics -->
    <div class="stats">

        <div class="stat-card">
            <h3>Total Exams</h3>
            <p id="totalExams">0</p>
        </div>

        <div class="stat-card">
            <h3>Published Exams</h3>
            <p id="publishedExams">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Total MCQ Questions</h3>
            <p id="totalQuestions">0</p>
        </div>

        <div class="stat-card">
            <h3>Submitted Exams</h3>
            <p id="submittedExams">0</p>
        </div>

    </div>

    <!-- Actions -->
    <div class="actions">

        <button class="action-btn" onclick="location.href='create-exam.html'">
            ➕ Create Exam
            <span>Create a new examination</span>
        </button>

        <button class="action-btn" onclick="location.href='manage-exams.html'">
            📚 Manage Exams
            <span>Edit, publish or delete exams</span>
        </button>

        <button class="action-btn" onclick="location.href='admin-results.html'">
            📊 Student Results
            <span>View submitted exam results</span>
        </button>

        <button class="action-btn" onclick="location.href='admin-students.html'">
            👨‍🎓 Students
            <span>View registered students</span>
        </button>

        <button class="action-btn" onclick="location.href='manage-questions.html'">
            ❓ MCQ Questions
            <span>Manage MCQ question bank</span>
        </button>

        <!-- NEW CQ BUTTON -->
        <button class="action-btn" onclick="location.href='cq-answer-sheets.html'">
            📝 CQ Answer Sheets
            <span>View answer sheets and give marks</span>
        </button>

        <button class="action-btn" onclick="loadDashboard()">
            🔄 Refresh
            <span>Refresh dashboard statistics</span>
        </button>

    </div>

    <!-- Recent Results -->
    <div class="section">
        <h2>Recent Student Results</h2>

        <div id="resultsArea">
            <div class="empty">Loading...</div>
        </div>
    </div>

</div>

<script>

const supabaseClient = window.supabaseClient;

async function checkAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
        window.location.href = "admin-login.html";
        return false;
    }

    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admins")
            .select("id, full_name, email")
            .eq("auth_user_id", user.id)
            .maybeSingle();

    if (adminError || !admin) {
        alert("Unauthorized: admin account required.");
        await supabaseClient.auth.signOut();
        window.location.href = "admin-login.html";
        return false;
    }

    return true;
}


async function loadDashboard() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    try {

        const { data, error } =
            await supabaseClient.rpc("get_admin_dashboard_stats");

        if (error) {
            console.error(error);
            alert("Dashboard loading failed: " + error.message);
            return;
        }

        document.getElementById("totalExams").textContent =
            data.total_exams ?? 0;

        document.getElementById("publishedExams").textContent =
            data.published_exams ?? 0;

        document.getElementById("totalStudents").textContent =
            data.total_students ?? 0;

        document.getElementById("totalQuestions").textContent =
            data.total_questions ?? 0;

        document.getElementById("submittedExams").textContent =
            data.submitted_exams ?? 0;

        await loadRecentResults();

    } catch (err) {

        console.error(err);

    }
}


async function loadRecentResults() {

    const area = document.getElementById("resultsArea");

    const { data, error } =
        await supabaseClient
            .from("admin_exam_results")
            .select("*")
            .order("submitted_at", { ascending: false })
            .limit(5);

    if (error) {

        area.innerHTML =
            `<div class="empty">
                Could not load recent results.
            </div>`;

        console.error(error);
        return;
    }

    if (!data || data.length === 0) {

        area.innerHTML =
            `<div class="empty">
                No submitted results yet.
            </div>`;

        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Exam</th>
                    <th>Marks</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
    `;

    data.forEach(row => {

        html += `
            <tr>
                <td>${escapeHtml(row.student_name || "-")}</td>
                <td>${escapeHtml(row.exam_title || "-")}</td>
                <td>
                    ${row.obtained_marks ?? 0}
                    /
                    ${row.total_marks ?? 0}
                </td>
                <td>${escapeHtml(row.status || "-")}</td>
            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    area.innerHTML = html;
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function logout() {

    await supabaseClient.auth.signOut();

    localStorage.removeItem("porikkhahub_admin");
    localStorage.removeItem("porikkhahub_admin_access_token");
    localStorage.removeItem("porikkhahub_admin_refresh_token");

    window.location.href = "admin-login.html";
}


loadDashboard();

</script>

</body>
</html>
