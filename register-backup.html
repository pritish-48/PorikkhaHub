<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PorikkhaHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f9fc;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #5b4bff;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #5b4bff;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #5b4bff;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #667085;
        }

        .bottom a {
            color: #5b4bff;
            font-weight: 700;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667085;
            text-decoration: none;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="logo">PorikkhaHub</div>

    <p class="subtitle">
        Create your student account
    </p>

    <form>

        <label>Full Name</label>
        <input
            type="text"
            placeholder="Enter your full name"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            placeholder="01XXXXXXXXX"
            required
        >

        <label>Password</label>
        <input
            type="password"
            placeholder="Create a password"
            required
        >

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

</body>
</html>
