<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Admin Password | PorikkhaHub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#111827,#1e3a8a);
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:800;
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin:8px 0 28px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:24px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

#message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">PorikkhaHub</div>

    <div class="subtitle">Reset Admin Password</div>

    <label>Admin Email</label>

    <input
        type="email"
        id="email"
        value="pritishghosh4769@gmail.com"
    >

    <label>New Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter new password"
    >

    <button onclick="resetPassword()">
        Set New Password
    </button>

    <div id="message"></div>

</div>

<script>

async function resetPassword(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(password.length < 6){
        message.style.color = "#dc2626";
        message.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    message.style.color = "#2563eb";
    message.textContent = "Updating password...";

    try{

        const response = await fetch(
            "https://jsjkxpsnuizngofyjvdl.supabase.co/functions/v1/admin-reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    new_password: password
                })
            }
        );

        const result = await response.json();

        if(!response.ok || !result.success){

            message.style.color = "#dc2626";
            message.textContent =
                result.message || "Password reset failed.";

            return;
        }

        message.style.color = "#16a34a";
        message.textContent =
            "Password updated successfully!";

    }catch(error){

        message.style.color = "#dc2626";
        message.textContent =
            "Connection error. Please try again.";
    }
}

</script>

</body>
</html>
