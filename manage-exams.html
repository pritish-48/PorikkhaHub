<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Exams | PorikkhaHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:white;
    border-bottom:1px solid #ddd;
    padding:16px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#6c4df6;
}

.back-btn{
    text-decoration:none;
    color:#6c4df6;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:15px;
}

h1{
    font-size:30px;
}

.create-btn{
    background:#6c4df6;
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:8px;
    font-weight:bold;
}

.exam-list{
    display:grid;
    gap:18px;
}

.exam{
    background:white;
    border-radius:14px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.exam-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.exam h2{
    margin-bottom:8px;
}

.description{
    color:#666;
    margin-bottom:15px;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
}

.badge{
    background:#f0f0f5;
    padding:7px 11px;
    border-radius:7px;
    font-size:13px;
}

.status{
    padding:7px 11px;
    border-radius:7px;
    font-weight:bold;
    font-size:13px;
}

.published{
    background:#dcfce7;
    color:#166534;
}

.draft{
    background:#fef3c7;
    color:#92400e;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button,
.action-link{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
    font-size:14px;
}

.publish{
    background:#16a34a;
    color:white;
}

.unpublish{
    background:#f59e0b;
    color:white;
}

.questions{
    background:#6c4df6;
    color:white;
}

.delete{
    background:#ef4444;
    color:white;
}

.refresh{
    background:#e5e7eb;
    color:#222;
}

.message{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#666;
}

@media(max-width:700px){
    header{
        padding:15px 18px;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .exam-header{
        flex-direction:column;
    }
}
</style>

</head>

<body>

<header>
    <div class="logo">PorikkhaHub</div>

    <a class="back-btn" href="admin-dashboard.html">
        ← Admin Dashboard
    </a>
</header>

<div class="container">

    <div class="top">
        <h1>Manage Exams</h1>

        <div>
            <a class="create-btn" href="create-exam.html">
                + Create Exam
            </a>

            <button class="refresh" onclick="loadExams()">
                Refresh
            </button>
        </div>
    </div>

    <div id="examList">
        <div class="message">
            Loading exams...
        </div>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://jsjkxpsnuizngofyjvdl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rGBAYVe2ZeqDk8tvrYy2Tg_m4fbtSLf";


/* =========================
   AUTH TOKEN
========================= */

function getToken(){

    const token =
        localStorage.getItem(
            "porikkhahub_admin_access_token"
        );

    if(!token){

        alert("Admin session not found. Please login again.");

        window.location.href =
            "admin-login.html";

        return null;
    }

    return token;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   LOAD EXAMS
========================= */

async function loadExams(){

    const token = getToken();

    if(!token) return;

    const list =
        document.getElementById("examList");

    list.innerHTML =
        '<div class="message">Loading exams...</div>';

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/exams?select=*&order=created_at.desc",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":"Bearer " + token
                    }
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);
        }

        const exams =
            await response.json();

        if(!exams.length){

            list.innerHTML =
                '<div class="message">No exams found.</div>';

            return;
        }

        list.innerHTML = "";

        exams.forEach(exam => {

            const div =
                document.createElement("div");

            div.className = "exam";

            const isPublished =
                exam.is_published === true;

            const type =
                (exam.exam_type || "mcq")
                .toUpperCase();

            div.innerHTML = `

                <div class="exam-header">

                    <div>

                        <h2>
                            ${escapeHtml(
                                exam.title ||
                                exam.name ||
                                "Untitled Exam"
                            )}
                        </h2>

                        <div class="description">
                            ${escapeHtml(
                                exam.description ||
                                "No description"
                            )}
                        </div>

                    </div>

                    <span class="status ${
                        isPublished
                        ? "published"
                        : "draft"
                    }">

                        ${
                            isPublished
                            ? "Published"
                            : "Draft"
                        }

                    </span>

                </div>

                <div class="info">

                    <span class="badge">
                        📚 ${type}
                    </span>

                    <span class="badge">
                        ⏱️ ${
                            exam.duration_minutes || 0
                        } minutes
                    </span>

                    <span class="badge">
                        🏆 ${
                            exam.total_marks || 0
                        } marks
                    </span>

                </div>

                <div class="actions">

                    <button
                        class="${
                            isPublished
                            ? "unpublish"
                            : "publish"
                        }"
                        onclick="togglePublish(
                            '${exam.id}',
                            ${isPublished}
                        )"
                    >
                        ${
                            isPublished
                            ? "Unpublish"
                            : "Publish"
                        }
                    </button>

                    <a
                        class="action-link questions"
                        href="manage-questions.html?exam=${encodeURIComponent(exam.id)}"
                    >
                        Manage Questions
                    </a>

                    <button
                        class="delete"
                        onclick="deleteExam('${exam.id}')"
                    >
                        Delete
                    </button>

                </div>
            `;

            list.appendChild(div);

        });

    }catch(error){

        console.error(error);

        list.innerHTML = `
            <div class="message">
                Failed to load exams.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =========================
   PUBLISH / UNPUBLISH
========================= */

async function togglePublish(
    examId,
    currentlyPublished
){

    const token = getToken();

    if(!token) return;

    const newStatus =
        !currentlyPublished;

    const action =
        newStatus
        ? "publish"
        : "unpublish";

    const confirmed =
        confirm(
            newStatus
            ? "Are you sure you want to publish this exam?"
            : "Are you sure you want to unpublish this exam?"
        );

    if(!confirmed) return;

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/exams?id=eq." +
                encodeURIComponent(examId),
                {
                    method:"PATCH",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({
                        is_published:newStatus
                    })
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);
        }

        alert(
            newStatus
            ? "Exam published successfully!"
            : "Exam unpublished successfully!"
        );

        await loadExams();

    }catch(error){

        console.error(error);

        alert(
            "Could not " +
            action +
            " exam.\n\n" +
            error.message
        );
    }
}


/* =========================
   DELETE EXAM
========================= */

async function deleteExam(examId){

    const token = getToken();

    if(!token) return;

    const confirmed =
        confirm(
            "Are you sure you want to delete this exam?\n\n" +
            "This action cannot be undone."
        );

    if(!confirmed) return;

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/exams?id=eq." +
                encodeURIComponent(examId),
                {
                    method:"DELETE",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token,

                        "Prefer":
                            "return=minimal"
                    }
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);
        }

        alert(
            "Exam deleted successfully!"
        );

        await loadExams();

    }catch(error){

        console.error(error);

        alert(
            "Could not delete exam.\n\n" +
            error.message
        );
    }
}


/* =========================
   START
========================= */

loadExams();

</script>

</body>
</html>
