<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CQ Result | PorikkhaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:800;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:700;
}

.gray{
    background:#e5e7eb;
    color:#111827;
}

.marked-btn{
    background:#2563eb;
    color:white;
    font-size:16px;
    padding:12px 18px;
}

.marked-btn:hover{
    background:#1d4ed8;
}

main{
    max-width:1000px;
    margin:25px auto;
    padding:0 16px;
}

.panel{
    background:white;
    padding:22px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.result{
    text-align:center;
}

.exam-title{
    font-size:25px;
    font-weight:800;
}

.score{
    font-size:42px;
    font-weight:900;
    margin:15px 0;
}

.question{
    border:1px solid #ddd;
    border-radius:14px;
    padding:18px;
    margin-top:18px;
}

.qtitle{
    font-size:19px;
    font-weight:800;
    margin-bottom:12px;
}

.question-text{
    background:#f8fafc;
    padding:14px;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.7;
}

.answer{
    background:#fffdf0;
    border:1px solid #e5d98b;
    padding:14px;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.7;
}

.feedback{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:13px;
    border-radius:8px;
    margin-top:12px;
    white-space:pre-wrap;
    line-height:1.6;
}

.images{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:12px;
}

.images img{
    width:100%;
    max-height:500px;
    object-fit:contain;
    border:1px solid #ddd;
    border-radius:9px;
    background:#eee;
}

.marked-images{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-top:15px;
}

.marked-page{
    background:#f8fafc;
    border:1px solid #dbe2ea;
    border-radius:12px;
    padding:10px;
}

.marked-page img{
    width:100%;
    max-height:700px;
    object-fit:contain;
    border-radius:8px;
    background:#eee;
    display:block;
}

.page-label{
    text-align:center;
    font-weight:700;
    margin-top:8px;
    color:#475569;
}

.marks{
    margin-top:15px;
    font-size:18px;
    font-weight:800;
}

.status{
    padding:13px;
    border-radius:9px;
    background:#f3f4f6;
}

.marked-status{
    padding:14px;
    border-radius:10px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    margin-top:15px;
}

.hidden{
    display:none;
}

.small{
    font-size:13px;
    color:#64748b;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

@media(max-width:600px){

    .score{
        font-size:34px;
    }

    .exam-title{
        font-size:21px;
    }

    header{
        padding:14px;
    }

    .logo{
        font-size:18px;
    }

    .marked-btn{
        width:100%;
    }
}
</style>
</head>


<body>


<header>

    <div class="logo">
        📖 PorikkhaHub
    </div>

    <button
        class="gray"
        onclick="goBack()"
    >
        ← My Results
    </button>

</header>


<main>


<div
    id="loading"
    class="panel"
>
    Loading result...
</div>


<div
    id="resultPanel"
    class="hidden"
>


    <div class="panel result">

        <div
            class="exam-title"
            id="examTitle"
        ></div>


        <div class="score">

            <span id="obtained">
                0
            </span>

            /

            <span id="total">
                0
            </span>

        </div>


        <div id="submitted"></div>


        <div style="margin-top:20px;">

            <button
                class="marked-btn"
                onclick="showMarkedSheet()"
            >
                👀 View Marked Answer Sheet
            </button>

        </div>

    </div>



    <!-- MARKED ANSWER SHEET -->

    <div
        id="markedSheetPanel"
        class="panel hidden"
    >

        <div class="section-title">

            <h2 style="margin:0;">
                🖍️ Teacher Marked Answer Sheet
            </h2>

            <button
                class="gray"
                onclick="hideMarkedSheet()"
            >
                Hide
            </button>

        </div>


        <div
            id="markedSheetStatus"
            class="marked-status"
        >
            Loading marked answer sheet...
        </div>


        <div id="markedQuestions"></div>

    </div>



    <div class="panel">

        <h2>
            📝 Question-wise Result
        </h2>

        <div id="questions"></div>

    </div>


</div>


</main>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://jsjkxpsnuizngofyjvdl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rGBAYVe2ZeqDk8tvrYy2Tg_m4fbtSLf";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   BACK
========================= */

function goBack(){

    window.location.href =
        "student-results.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   STUDENT SESSION
========================= */

async function restoreStudent(){

    const accessToken =
        localStorage.getItem(
            "porikkhahub_access_token"
        );


    const refreshToken =
        localStorage.getItem(
            "porikkhahub_refresh_token"
        );


    if(
        accessToken &&
        refreshToken
    ){

        const {error} =
            await supabaseClient.auth.setSession({

                access_token:
                    accessToken,

                refresh_token:
                    refreshToken

            });


        if(error){

            console.error(
                "Session restore error:",
                error
            );

        }

    }


    const {data,error} =
        await supabaseClient.auth.getUser();


    if(
        error ||
        !data.user
    ){

        alert(
            "Student login required."
        );


        window.location.href =
            "login.html";


        return false;

    }


    return true;

}


/* =========================
   GET ATTEMPT ID
========================= */

function getAttemptId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get(
        "attempt"
    );

}


/* =========================
   LOAD RESULT
========================= */

async function loadResult(){

    const attemptId =
        getAttemptId();


    if(!attemptId){

        showError(
            "Result attempt পাওয়া যায়নি।"
        );

        return;

    }


    console.log(
        "Loading CQ result:",
        attemptId
    );


    const {data,error} =
        await supabaseClient.rpc(
            "get_my_cq_result",
            {
                p_attempt_id:
                    attemptId
            }
        );


    if(error){

        console.error(
            "CQ result error:",
            error
        );


        showError(
            "Result load failed:<br><br>" +
            escapeHtml(
                error.message
            )
        );


        return;

    }


    console.log(
        "CQ result:",
        data
    );


    if(
        !data ||
        !data.length
    ){

        showError(
            "এই পরীক্ষার result পাওয়া যায়নি।"
        );


        return;

    }


    renderResult(data);

}


/* =========================
   RENDER RESULT
========================= */

function renderResult(rows){

    const first =
        rows[0];


    document
        .getElementById("loading")
        .classList.add("hidden");


    document
        .getElementById("resultPanel")
        .classList.remove("hidden");


    document
        .getElementById("examTitle")
        .textContent =
            first.exam_title;


    let calculatedObtained = 0;

    let calculatedTotal = 0;


    rows.forEach(row => {

        calculatedObtained +=
            Number(
                row.obtained_question_marks || 0
            );

        calculatedTotal +=
            Number(
                row.question_marks || 0
            );

    });


    document
        .getElementById("obtained")
        .textContent =
            calculatedObtained;


    document
        .getElementById("total")
        .textContent =
            calculatedTotal;


    document
        .getElementById("submitted")
        .textContent =
            first.submitted_at
            ? "Submitted: " +
              new Date(
                  first.submitted_at
              ).toLocaleString()
            : "";


    const box =
        document.getElementById(
            "questions"
        );


    box.innerHTML = "";


    rows.forEach(row => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "question";


        let images = [];


        try{

            if(
                Array.isArray(
                    row.answer_images
                )
            ){

                images =
                    row.answer_images;

            }else{

                images =
                    JSON.parse(
                        row.answer_images ||
                        "[]"
                    );

            }

        }catch(error){

            console.error(
                "Image parse error:",
                error
            );

            images = [];

        }


        let imageHTML = "";


        if(images.length){

            imageHTML = `

                <h3>
                    📷 Your Handwritten Answer
                </h3>

                <div class="images">

                    ${
                        images.map(
                            (img,i) => `

                                <div>

                                    <img
                                        src="${escapeHtml(img)}"
                                        alt="Answer page ${i+1}"
                                    >

                                    <div
                                        class="small"
                                        style="margin-top:5px"
                                    >
                                        Page ${i+1}
                                    </div>

                                </div>

                            `
                        ).join("")
                    }

                </div>

            `;

        }


        div.innerHTML = `

            <div class="qtitle">

                Question
                ${Number(
                    row.question_number
                )}

                —
                ${Number(
                    row.question_marks || 0
                )}
                marks

            </div>


            <div class="question-text">

                ${escapeHtml(
                    row.question_text
                )}

            </div>


            <div class="marks">

                Obtained:

                ${Number(
                    row.obtained_question_marks || 0
                )}

                /

                ${Number(
                    row.question_marks || 0
                )}

            </div>


            ${
                row.answer_text
                ? `

                    <h3>
                        📝 Your Answer
                    </h3>

                    <div class="answer">

                        ${escapeHtml(
                            row.answer_text
                        )}

                    </div>

                `
                : ""
            }


            ${imageHTML}


            ${
                row.teacher_feedback
                ? `

                    <h3>
                        👨‍🏫 Teacher Feedback
                    </h3>

                    <div class="feedback">

                        ${escapeHtml(
                            row.teacher_feedback
                        )}

                    </div>

                `
                : `

                    <div
                        class="status"
                        style="margin-top:15px"
                    >
                        👨‍🏫 Teacher feedback
                        এখনো দেওয়া হয়নি।
                    </div>

                `
            }

        `;


        box.appendChild(
            div
        );

    });

}


/* =========================
   SHOW MARKED SHEET
========================= */

async function showMarkedSheet(){

    const panel =
        document.getElementById(
            "markedSheetPanel"
        );


    const status =
        document.getElementById(
            "markedSheetStatus"
        );


    const box =
        document.getElementById(
            "markedQuestions"
        );


    panel.classList.remove(
        "hidden"
    );


    status.innerHTML =
        "⏳ Marked answer sheet loading...";


    box.innerHTML = "";


    panel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    const attemptId =
        getAttemptId();


    if(!attemptId){

        status.innerHTML =
            "❌ Exam attempt পাওয়া যায়নি.";

        return;
    }


    try{

        const {data,error} =
            await supabaseClient.rpc(
                "get_my_cq_marked_sheets",
                {
                    p_attempt_id:
                        attemptId
                }
            );


        if(error){

            console.error(
                "Marked sheet error:",
                error
            );


            status.innerHTML =
                "❌ Marked answer sheet load failed.<br><br>" +
                escapeHtml(
                    error.message
                );


            return;
        }


        console.log(
            "Marked sheets:",
            data
        );


        if(
            !data ||
            !data.length
        ){

            status.innerHTML =
                "ℹ️ এই পরীক্ষার marked answer sheet এখনো পাওয়া যায়নি.";

            return;
        }


        let markedCount = 0;


        data.forEach(row => {

            let annotations = [];


            try{

                if(
                    Array.isArray(
                        row.annotation_data
                    )
                ){

                    annotations =
                        row.annotation_data;

                }else{

                    annotations =
                        JSON.parse(
                            row.annotation_data ||
                            "[]"
                        );

                }

            }catch(error){

                console.error(
                    "Annotation parse error:",
                    error
                );

                annotations = [];

            }


            const markedImages =
                annotations
                    .filter(
                        item =>
                            item &&
                            typeof item.marked_image === "string"
                    )
                    .sort(
                        (a,b) =>
                            Number(
                                a.image_index || 0
                            ) -
                            Number(
                                b.image_index || 0
                            )
                    );


            if(
                markedImages.length
            ){

                markedCount +=
                    markedImages.length;

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "question";


            let markedHTML = "";


            if(
                markedImages.length
            ){

                markedHTML = `

                    <h3>
                        🖍️ Teacher's Marking
                    </h3>

                    <div class="marked-images">

                `;


                markedImages.forEach(
                    (item,index) => {

                        /*
                         * Fix escaped data URL.
                         *
                         * data\:image/jpeg
                         * becomes
                         * data:image/jpeg
                         */

                        let markedSrc =
                            String(
                                item.marked_image ||
                                ""
                            );


                        markedSrc =
                            markedSrc.replace(
                                /^data\\:/,
                                "data:"
                            );


                        /*
                         * Extra safety:
                         * sometimes JSON escaping can
                         * create backslashes.
                         */

                        markedSrc =
                            markedSrc.replace(
                                /^data\\\\:/,
                                "data:"
                            );


                        /*
                         * Validate image
                         */

                        if(
                            !markedSrc.startsWith(
                                "data:image/"
                            )
                        ){

                            console.error(
                                "Invalid marked image:",
                                markedSrc.substring(
                                    0,
                                    100
                                )
                            );

                            return;
                        }


                        markedHTML += `

                            <div
                                class="marked-page"
                            >

                                <img
                                    src="${markedSrc}"
                                    alt="Teacher marked page ${index + 1}"
                                    style="
                                        display:block;
                                        width:100%;
                                        max-width:900px;
                                        height:auto;
                                        object-fit:contain;
                                    "
                                >

                                <div
                                    class="page-label"
                                >
                                    Marked Page ${index + 1}
                                </div>

                            </div>

                        `;

                    }
                );


                markedHTML += `

                    </div>

                `;

            }else{

                markedHTML = `

                    <div
                        class="status"
                        style="margin-top:15px"
                    >
                        🕐 এই প্রশ্নের খাতা এখনো mark করা হয়নি।
                    </div>

                `;

            }


            div.innerHTML = `

                <div class="qtitle">

                    Question
                    ${Number(
                        row.question_number
                    )}

                    —
                    ${Number(
                        row.question_marks || 0
                    )}
                    marks

                </div>


                <div class="question-text">

                    ${escapeHtml(
                        row.question_text
                    )}

                </div>


                <div class="marks">

                    Obtained:

                    ${Number(
                        row.obtained_marks || 0
                    )}

                    /

                    ${Number(
                        row.question_marks || 0
                    )}

                </div>


                ${markedHTML}


                ${
                    row.teacher_feedback
                    ? `

                        <h3>
                            👨‍🏫 Teacher Feedback
                        </h3>

                        <div class="feedback">

                            ${escapeHtml(
                                row.teacher_feedback
                            )}

                        </div>

                    `
                    : ""
                }

            `;


            box.appendChild(
                div
            );

        });


        if(
            markedCount > 0
        ){

            status.innerHTML =
                "✅ Teacher marked answer sheet loaded successfully.";

        }else{

            status.innerHTML =
                "ℹ️ Teacher এখনো কোনো page mark করেননি.";

        }


    }catch(error){

        console.error(
            "Unexpected marked sheet error:",
            error
        );


        status.innerHTML =
            "❌ Unexpected error:<br><br>" +
            escapeHtml(
                error.message
            );

    }

}


/* =========================
   HIDE MARKED SHEET
========================= */

function hideMarkedSheet(){

    document
        .getElementById(
            "markedSheetPanel"
        )
        .classList.add(
            "hidden"
        );

}


/* =========================
   ERROR
========================= */

function showError(message){

    const loading =
        document.getElementById(
            "loading"
        );


    loading.innerHTML = `

        <div class="status">

            ❌ ${message}

        </div>

    `;

}


/* =========================
   START
========================= */

(async function(){

    const ok =
        await restoreStudent();


    if(!ok){

        return;

    }


    await loadResult();

})();
</script>

</body>
</html>
