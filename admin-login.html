<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | PorikkhaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.10);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #4f46e5;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #334155;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 18px;
}

input:focus {
    outline: none;
    border-color: #4f46e5;
}

.login-btn,
.forgot-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.login-btn {
    border: none;
    background: #4f46e5;
    color: white;
    margin-top: 5px;
}

.login-btn:hover {
    background: #4338ca;
}

.forgot-btn {
    background: white;
    color: #4f46e5;
    border: 2px solid #4f46e5;
    margin-top: 5px;
    margin-bottom: 12px;
}

.forgot-btn:hover {
    background: #eef2ff;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}

.back {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #64748b;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">PorikkhaHub</div>

    <div class="subtitle">
        Admin Panel Login
    </div>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <!-- FORGOT PASSWORD -->
        <button
            type="button"
            id="forgotPasswordBtn"
            class="forgot-btn"
        >
            Forgot Password?
        </button>

        <!-- LOGIN -->
        <button
            type="submit"
            id="loginBtn"
            class="login-btn"
        >
            Login as Admin
        </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://jsjkxpsnuizngofyjvdl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rGBAYVe2ZeqDk8tvrYy2Tg_m4fbtSLf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const forgotPasswordBtn =
    document.getElementById("forgotPasswordBtn");

const message =
    document.getElementById("message");


function showMessage(text, color) {

    message.textContent = text;
    message.style.color = color;

}


/* =========================
   ADMIN LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;

        if (!email || !password) {

            showMessage(
                "Please enter email and password.",
                "#dc2626"
            );

            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            if (!data.user) {
                throw new Error("Login failed.");
            }


            /* VERIFY ADMIN */

            const {
                data: admin,
                error: adminError
            } =
                await supabaseClient
                .from("admins")
                .select("*")
                .eq(
                    "auth_user_id",
                    data.user.id
                )
                .maybeSingle();

            if (adminError) {
                throw adminError;
            }

            if (!admin) {

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "This account is not an admin account."
                );
            }


            /* SAVE SESSION */

            localStorage.setItem(
                "porikkhahub_admin",
                JSON.stringify(admin)
            );

            localStorage.setItem(
                "porikkhahub_admin_access_token",
                data.session.access_token
            );

            localStorage.setItem(
                "porikkhahub_admin_refresh_token",
                data.session.refresh_token
            );


            showMessage(
                "Login successful! Redirecting...",
                "#16a34a"
            );

            setTimeout(function() {

                window.location.href =
                    "admin-dashboard.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Login failed.",
                "#dc2626"
            );

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent =
                "Login as Admin";

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotPasswordBtn.addEventListener(
    "click",
    async function() {

        const email =
            document.getElementById("email")
            .value
            .trim();

        if (!email) {

            showMessage(
                "First enter your admin email.",
                "#dc2626"
            );

            document
                .getElementById("email")
                .focus();

            return;
        }

        forgotPasswordBtn.disabled = true;

        forgotPasswordBtn.textContent =
            "Sending reset email...";

        showMessage(
            "Sending password reset email...",
            "#2563eb"
        );


        try {

            const resetUrl =
                new URL(
                    "admin-reset.html",
                    window.location.href
                ).href;


            const {
                error
            } =
                await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo: resetUrl
                    }
                );


            if (error) {
                throw error;
            }


            showMessage(
                "Password reset email sent. Check your email.",
                "#16a34a"
            );


        } catch (error) {

            console.error(
                "Reset error:",
                error
            );

            showMessage(
                error.message ||
                "Could not send reset email.",
                "#dc2626"
            );

        } finally {

            forgotPasswordBtn.disabled = false;

            forgotPasswordBtn.textContent =
                "Forgot Password?";

        }

    }
);

</script>

</body>
</html>
